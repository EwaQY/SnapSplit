name: Flutter CI

# 只在分支上跑：push 与 PR 均排除 main 分支，避免在 main 上触发。
on:
  push:
    branches-ignore:
      - main
    paths:
      - 'src/app/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'src/app/**'
      - '.github/workflows/flutter-ci.yml'

defaults:
  run:
    working-directory: src/app

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - run: flutter test

  build-android:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: src/app/build/app/outputs/flutter-apk/app-debug.apk
